
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>CampLink</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
            background: #111317;
            color: #f4f4f6;
        }

        main {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding:
                    max(24px, env(safe-area-inset-top))
                    28px
                    max(24px, env(safe-area-inset-bottom));
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            background: #e8ff72;
            color: #111317;
            font-size: 38px;
            font-weight: 800;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 30px;
        }

        .subtitle {
            color: #a8abb4;
            font-size: 14px;
        }

        .state {
            margin-top: 45px;
            font-size: 16px;
            font-weight: 600;
        }

        .description {
            max-width: 300px;
            color: #a8abb4;
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            min-width: 190px;
            padding: 15px 20px;
            border: 0;
            border-radius: 14px;
            background: #e8ff72;
            color: #111317;
            font-size: 15px;
            font-weight: 700;
        }

        button:disabled {
            opacity: .55;
        }
    </style>
</head>
<body>
<main>
    <div class="logo">C</div>
    <h1>CampLink</h1>
    <div class="subtitle">Связь без границ.</div>

    <div class="state" id="status">
        Проверяем соединение…
    </div>

    <p class="description" id="description">
        Подключаемся к серверу CampLink.
    </p>

    <button id="retry" type="button">
        Повторить подключение
    </button>
</main>

<script>
    const server = 'https://chat.camplink.ru';
    const status = document.getElementById('status');
    const description =
        document.getElementById('description');
    const button = document.getElementById('retry');

    let checking = false;

    function checkConnection() {
        if (checking) return;

        checking = true;
        button.disabled = true;
        status.textContent = 'Подключаемся…';

        const image = new Image();
        let finished = false;

        const timeout = setTimeout(() => {
            finish(false);
        }, 6000);

        function finish(success) {
            if (finished) return;

            finished = true;
            checking = false;
            clearTimeout(timeout);

            if (success) {
                status.textContent = 'Соединение найдено';
                window.location.replace(server);
                return;
            }

            status.textContent = 'Нет соединения с сервером';
            description.textContent =
                'CampLink установлен на устройстве. ' +
                'Сервер сейчас недоступен. ' +
                'Попробуем подключиться снова.';
            button.disabled = false;
        }

        image.onload = () => finish(true);
        image.onerror = () => finish(false);

        image.src =
            server + '/favicon.svg?probe=' +
            Date.now();
    }

    button.addEventListener('click', checkConnection);
    window.addEventListener('online', checkConnection);

    document.addEventListener(
        'visibilitychange',
        () => {
            if (!document.hidden) checkConnection();
        }
    );

    setInterval(checkConnection, 15000);
    checkConnection();
</script>
</body>
</html>
